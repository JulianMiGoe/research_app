<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Idle- und Aufbauspiel: Du leitest eine Arbeitsgruppe für Salzwiesenökologie.">
<meta name="theme-color" content="#FBFCFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14252A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}</style>
<title>Proben, Paper, Professur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wght@400;600&family=Permanent+Marker&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: einspaltige Handy-App. Oben das Kassenbuch, unten die Tab-Leiste,
   dazwischen Karten: Studien als beschriftete Probenbeutel mit Markierband. */
:root {
  --bg: #E6ECE8; --grid: rgba(21, 49, 58, .05); --sheet: #FBFCFA; --sheet-2: #EEF3EF;
  --ink: #15313A; --ink-2: #34505A; --muted: #5B6F76; --line: #C9D4CE;
  --tape: #D42A63; --tape-ink: #FFFFFF; --tape-soft: #FBE1EA;
  --probe: #7A5A2E; --daten: #2D59C8; --euro: #8E6200; --rep: #7650A8;
  --ok: #2E7D4F; --warn: #915600; --bad: #B8382A; --ok-soft: #DCEFE3; --warn-soft: #F7EAD2; --bad-soft: #F6DEDA;
  --well: #D8E1DC; --well-on: #E5B413; --well-now: #3D63D8;
  --z1: #B5A891; --z2: #9DB158; --z3: #5F8F4D; --z4: #8B7FB6;
  --night: #CDD8D5; --day: #F6F1D9;
  --a-feld: #008300; --a-labor: #2a78d6; --a-halle: #1baf7a; --a-stat: #eb6834; --a-schreiben: #6250d6; --a-verw: #e87ba4;
  --a-feld-soft: #D3E9D2; --a-labor-soft: #D9E7F4; --a-halle-soft: #D7F0E6; --a-stat-soft: #F9E4DA; --a-schreiben-soft: #E3E0F4; --a-verw-soft: #F8E7EC;
  --sea: #CFE1E7; --land: #F3F5EC; --land-dk: #E4E8DC;
  --overlay: rgba(10, 24, 29, .45); --shadow: rgba(10, 30, 36, .22);
  --f-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mark: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  --f-pub: "STIX Two Text", "Times New Roman", Times, serif;
  --f-num: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A1E; --grid: rgba(214, 232, 226, .045); --sheet: #14252A; --sheet-2: #1A2F35;
    --ink: #E2ECE8; --ink-2: #BDD0CA; --muted: #8FA3A3; --line: #2B4148;
    --tape: #FF5C8F; --tape-ink: #1A0710; --tape-soft: #4A1D2D;
    --probe: #D6AC6C; --daten: #88A8FF; --euro: #E6B64D; --rep: #C0A2EB;
    --ok: #63C98E; --warn: #F0AC45; --bad: #FF8473; --ok-soft: #153526; --warn-soft: #3A2B10; --bad-soft: #3F1D19;
    --well: #223A40; --well-on: #F0C63E; --well-now: #6F91F6;
    --z1: #6F6757; --z2: #6E8240; --z3: #46703A; --z4: #6A5E93;
    --night: #0B171B; --day: #2C3B33;
    --a-feld: #008300; --a-labor: #3987e5; --a-halle: #199e70; --a-stat: #d95926; --a-schreiben: #9085e9; --a-verw: #d55181;
    --a-feld-soft: #0E3F1E; --a-labor-soft: #1E405E; --a-halle-soft: #15473E; --a-stat-soft: #4B3429; --a-schreiben-soft: #37405F; --a-verw-soft: #4A3142;
    --sea: #0E2830; --land: #243B3A; --land-dk: #1C3130;
    --overlay: rgba(0, 0, 0, .6); --shadow: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1A1E; --grid: rgba(214, 232, 226, .045); --sheet: #14252A; --sheet-2: #1A2F35;
  --ink: #E2ECE8; --ink-2: #BDD0CA; --muted: #8FA3A3; --line: #2B4148;
  --tape: #FF5C8F; --tape-ink: #1A0710; --tape-soft: #4A1D2D;
  --probe: #D6AC6C; --daten: #88A8FF; --euro: #E6B64D; --rep: #C0A2EB;
  --ok: #63C98E; --warn: #F0AC45; --bad: #FF8473; --ok-soft: #153526; --warn-soft: #3A2B10; --bad-soft: #3F1D19;
  --well: #223A40; --well-on: #F0C63E; --well-now: #6F91F6;
  --z1: #6F6757; --z2: #6E8240; --z3: #46703A; --z4: #6A5E93;
  --night: #0B171B; --day: #2C3B33;
  --a-feld: #008300; --a-labor: #3987e5; --a-halle: #199e70; --a-stat: #d95926; --a-schreiben: #9085e9; --a-verw: #d55181;
  --a-feld-soft: #0E3F1E; --a-labor-soft: #1E405E; --a-halle-soft: #15473E; --a-stat-soft: #4B3429; --a-schreiben-soft: #37405F; --a-verw-soft: #4A3142;
  --sea: #0E2830; --land: #243B3A; --land-dk: #1C3130;
  --overlay: rgba(0, 0, 0, .6); --shadow: rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-ui);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
input { font: inherit; }
h2, h3, p { margin: 0; }
:focus-visible { outline: 2.5px solid var(--daten); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.eyebrow { font: 700 11px/1.25 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h3.eyebrow { margin-top: 6px; }
.muted { color: var(--muted); }
.small { font-size: 13px; line-height: 1.4; }
.center { text-align: center; align-self: center; }
.wrap { max-width: 640px; margin: 0 auto; }

/* Kassenbuch */
.ledger {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--sheet); border-bottom: 1px solid var(--line);
  padding-block: 8px 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.l-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.l-date { display: flex; flex-direction: column; min-width: 0; }
.l-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.l-kw { font: 600 13px/1.3 var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.l-sem { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.wx { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.wx .ic { width: 15px; height: 15px; align-self: center; }
.inbox-btn { position: relative; flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet-2); cursor: pointer; }
.badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--tape); color: var(--tape-ink); font: 700 11px/18px var(--f-ui); text-align: center; }
.res { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 7px; }
.res > div, .res-btn { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.res-btn { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.res .lbl { display: flex; align-items: center; gap: 4px; font: 700 10px/1.2 var(--f-ui); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
.res .lbl .ic { width: 13px; height: 13px; }
.res .val { font: 600 15px/1.25 var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res .sub { font: 400 10px/1.25 var(--f-num); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res-btn .sub { text-decoration: underline dotted; text-underline-offset: 2px; }
.h-i { font: italic 600 16px/1 var(--f-pub); }
.c-euro { color: var(--euro); } .c-rep { color: var(--rep); } .c-h { color: var(--ink-2); } .c-admin { color: var(--ink-2); }
#res-money.neg .val, #res-admin.neg .val, #res-admin.neg .sub { color: var(--bad); }
@media (max-width: 400px) { .res .lbl .ic { display: none; } .res .lbl { letter-spacing: .03em; } .res .val { font-size: 14px; } }

/* Hauptbereich */
main {
  display: flex; flex-direction: column; gap: 14px; max-width: 640px; margin: 0 auto;
  padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card, .bag, .ooo { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; }
.card { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.calm { padding: 12px 14px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card h2, .sh-head h2 { font: 700 17px/1.25 var(--f-ui); text-wrap: balance; }
.info { margin-top: 8px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: center; }
.two .btn { width: 100%; white-space: normal; text-align: center; padding-block: 6px; line-height: 1.2; }
.alert { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 6px; font-size: 13.5px; line-height: 1.4; }
.alert.ok { background: var(--ok-soft); } .alert.warn { background: var(--warn-soft); } .alert.bad { background: var(--bad-soft); }
.chip { display: inline-block; padding: 3px 8px; border-radius: 999px; font: 700 11px/1.2 var(--f-ui); background: var(--sheet-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.warn { background: var(--tape); border-color: transparent; color: var(--tape-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { align-self: flex-start; font: 700 10.5px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); padding: 3px 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--sheet-2); }
.tag.warn { color: var(--tape-ink); background: var(--tape); border-color: transparent; }
.ptitle { font: italic 400 17px/1.35 var(--f-pub); overflow-wrap: anywhere; text-wrap: pretty; }
.ptitle.sm { font-size: 15.5px; }
.jn { font-family: var(--f-pub); font-style: italic; }
.warn-t { color: var(--bad) !important; }

/* Hinweis & Entscheidungen */
.hint { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 12px 14px; border-radius: 6px; background: var(--tape-soft); }
.decs { border-color: var(--tape); box-shadow: inset 4px 0 0 var(--tape); }
.dec-list li + li { border-top: 1px solid var(--line); }
.dec-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 0; border: 0; background: none; text-align: left; cursor: pointer; }
.dec-row > .ic { color: var(--muted); }
.dec-ic { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--tape-soft); color: var(--tape); }
.dec-ic .ic { width: 19px; height: 19px; }

/* Abwesenheitsnotiz */
.ooo { width: 100%; text-align: left; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.ooo-head { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.ooo-change { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.ooo-change .ic { width: 15px; height: 15px; }
.ooo-name { font: 700 18px/1.2 var(--f-ui); }
.ooo-reply { font: italic 400 15px/1.45 var(--f-pub); color: var(--ink-2); border-left: 3px solid var(--line); padding-left: 10px; }
.ooo-reply.sm { font-size: 14px; }
.ooo-eff { font-size: 13px; line-height: 1.4; color: var(--muted); }
.hours { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--sheet-2); border: 1px solid var(--line); margin-top: 4px; }
.hours i { display: block; height: 100%; }
.h-l { background: var(--rep); } .h-v { background: var(--muted); } .h-f { background: var(--tape); }
.hours-key { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; color: var(--muted); }
.hours-key span { display: inline-flex; align-items: center; gap: 5px; }
.hours-key i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* Lagebild */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: 6px; background: var(--sheet-2); min-width: 0; border-top: 3px solid var(--kc, var(--line)); }
.kpi.k-money { --kc: var(--euro); } .kpi.k-rep { --kc: var(--rep); } .kpi.k-h { --kc: var(--ink-2); } .kpi.k-cites { --kc: var(--daten); }
.kpi .spark { color: var(--kc, var(--daten)); }
.kpi b { font: 600 17px/1.2 var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi small { font-size: 11.5px; color: var(--muted); }
.spark { display: block; width: 100%; height: 26px; color: var(--daten); }
.flow { display: flex; flex-wrap: wrap; gap: 10px 14px; }
.fl-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fl-row { display: flex; gap: 3px; }
.fl { display: flex; flex-direction: column; align-items: center; min-width: 44px; padding: 5px 3px; border-radius: 4px; background: var(--sheet-2); border: 1px solid var(--line); }
.fl b { font: 600 15px/1.1 var(--f-num); }
.fl small { font-size: 10px; color: var(--muted); white-space: nowrap; }
.fl.zero b { color: var(--muted); font-weight: 400; }
.fl-group.pub .fl { background: var(--ink); border-color: var(--ink); }
.fl-group.pub .fl b, .fl-group.pub .fl small { color: var(--sheet); }
.dec-row.static { cursor: default; }
.ok-t { color: var(--ok) !important; font-weight: 700; }
/* Diagramme */
.charts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 18px; }
@media (min-width: 600px) { .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.lc svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: pan-y; }
.lc .ln { fill: none; stroke: var(--daten); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.lc .gl, .chart .gl { stroke: var(--line); stroke-width: 1; }
.lc .zero { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.lc .cross { stroke: var(--ink-2); stroke-width: 1; }
.lc .dot { fill: var(--daten); stroke: var(--sheet); stroke-width: 2; }
.lc .t, .chart .t { font: 400 9px var(--f-num); fill: var(--muted); }
.chart .t.v { fill: var(--ink-2); font-weight: 600; }
.lc-tip { min-height: 1.4em; font-family: var(--f-num); font-size: 11.5px; }
.bar-m { fill: var(--daten); }
.hbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.hbars li { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 2.5em; gap: 8px; align-items: center; font-size: 13px; }
.hb-l { font-family: var(--f-pub); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-t { height: 10px; }
.hb-t i { display: block; height: 100%; background: var(--daten); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-v { font: 600 12px var(--f-num); text-align: right; }
/* Laufbahnen */
.pipe { display: flex; align-items: flex-start; gap: 7px; }
.pipe-col { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; border-radius: 6px; background: var(--sheet-2); }
.pipe-col + .pipe-col::before { content: ""; position: absolute; left: -7px; top: 15px; width: 5px; height: 5px; border-top: 1.5px solid var(--muted); border-right: 1.5px solid var(--muted); transform: rotate(45deg); }
.pipe-col b { font: 600 18px/1 var(--f-num); }
.pipe-col .pl { font: 700 10px/1.2 var(--f-ui); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avs { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 20px; }
.avs i, .avs button { width: 20px; height: 20px; padding: 0; border-radius: 50%; display: grid; place-items: center; font: 700 8.5px/1 var(--f-ui); font-style: normal; background: var(--a-soft, var(--sheet)); border: 1.5px solid var(--a, var(--line)); color: var(--ink); }
.avs button { cursor: pointer; }
.avs i.more { background: transparent; border-style: dashed; }
.pipe-arr { align-self: center; color: var(--muted); flex: none; }
.pipe-arr .ic { width: 10px; height: 10px; }
.path { font-size: 12px; color: var(--ink-2); }
.tl { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.tl li { position: relative; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tl li::before { content: ""; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--ink-2); }
.tl li:last-child::before { background: var(--tape); border-color: var(--tape); }
.tl small { color: var(--muted); font-family: var(--f-num); font-size: 11px; }
.strength { display: inline-flex; gap: 2px; flex: none; }
.strength i { width: 7px; height: 14px; border-radius: 2px; background: var(--line); }
.strength i.f { background: var(--daten); }
textarea.code { width: 100%; min-width: 0; padding: 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--sheet-2); color: var(--ink); font: 400 11px/1.4 var(--f-num); resize: vertical; word-break: break-all; }
.mono { font-family: var(--f-num); letter-spacing: .03em; }

/* Karte der Feldgebiete */
.map { margin: 0; }
.map svg { display: block; width: 100%; height: auto; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); }
.map .sea { fill: var(--sea); }
.map .coast { fill: var(--land); stroke: var(--line); stroke-width: .7; stroke-linejoin: round; }
.map .coast.dk { fill: var(--land-dk); }
.map .border { fill: none; stroke: var(--muted); stroke-width: .7; stroke-dasharray: 2 2; opacity: .7; }
.map .sea-l { font: italic 400 11px var(--f-pub); fill: var(--ink-2); opacity: .75; letter-spacing: .06em; }
.map .land-l { font: 700 6.5px var(--f-ui); fill: var(--muted); letter-spacing: .16em; }
.map .city circle { fill: var(--muted); }
.map .city text { font: 400 7.5px var(--f-ui); fill: var(--muted); }
.map .mk .hit { fill: transparent; }
.map .mk .dot { fill: var(--ink); stroke: var(--sheet); stroke-width: 1.5; }
.map .mk.locked .dot { fill: var(--sheet); stroke: var(--muted); stroke-dasharray: 2 1.5; }
.map .mk .lv { font: 700 8px var(--f-num); fill: var(--sheet); text-anchor: middle; }
.map .mk .lb { font: 700 9px var(--f-ui); fill: var(--ink); paint-order: stroke; stroke: var(--sheet); stroke-width: 2.6px; stroke-linejoin: round; }
.map .mk.locked .lb { fill: var(--muted); font-weight: 400; }
.map .mk .ring { fill: none; stroke: var(--tape); stroke-width: 2.5; }
.map .mk .act { fill: var(--tape); stroke: var(--sheet); stroke-width: 1; }
.map .mk.off { opacity: .35; }
.map .mk[data-a] { cursor: pointer; }
.map .mk[data-a]:hover .dot { stroke: var(--tape); }
.map .mk:focus { outline: none; }
.map .mk:focus-visible .dot { stroke: var(--daten); stroke-width: 2.5; }
.legend i.lg-open { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border-color: var(--ink); }
.legend i.lg-locked { width: 10px; height: 10px; border-radius: 50%; background: var(--sheet); border: 1.5px dashed var(--muted); }
.legend i.lg-act { width: 7px; height: 7px; border-radius: 50%; background: var(--tape); border-color: var(--tape); }
.card.me { box-shadow: inset 4px 0 0 var(--ink-2); }
/* Versuchshalle: randomisierte Aufstellung, Kontrolle ungefüllt, Behandlungen gefüllt */
.xgrid { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.xgrid svg { display: block; width: 100%; height: auto; max-width: 100%; }
.pot .pt { stroke-width: 1.3; stroke-linejoin: round; }
.pot.x1 .pt { fill: var(--sheet); stroke: var(--ink-2); }
.pot.x2 .pt { fill: var(--daten); stroke: var(--daten); }
.pot.x3 .pt { fill: var(--tape); stroke: var(--tape); }
.pot.empty .pt { fill: none; stroke: var(--line); stroke-dasharray: 2 2; }
.pot .lf { fill: var(--z3); } .pot .lf.meh { fill: var(--z2); } .pot .lf.bad { fill: var(--z1); }
.pot .bub { fill: var(--sheet); } .pot.x1 .bub { fill: var(--ink-2); }
.sw.x1 { background: var(--sheet); border: 1.5px solid var(--ink-2); } .sw.x2 { background: var(--daten); } .sw.x3 { background: var(--tape); }
.hx { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.h-a { background: var(--probe); }
/* Büros */
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.room { display: flex; flex-direction: column; gap: 4px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet-2); min-width: 0; }
.room b { font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.room > small { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.room.chef { box-shadow: inset 3px 0 0 var(--tape); }
.desks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.desk { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; padding: 0; border: 2px solid var(--a, var(--ink-2)); background: var(--a-soft, var(--sheet)); color: var(--ink); font: 700 10.5px/1 var(--f-ui); cursor: pointer; }
.desk.empty { border: 1.5px dashed var(--line); background: transparent; cursor: default; }
.rm-syn { font: 600 12px/1.2 var(--f-num); }
.syn-list { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13px; line-height: 1.38; }
.syn-list li { position: relative; padding-left: 16px; }
.syn-list li::before { position: absolute; left: 0; top: 0; font-weight: 700; }
.syn-list li.good::before { content: "+"; color: var(--ok); }
.syn-list li.bad::before { content: "−"; color: var(--bad); }
.desk-line { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet-2); text-align: left; cursor: pointer; }
.desk-line .row-main b { font-size: 13px; } .desk-line .row-main small { font-size: 12px; }
.desk-line > span:not(.row-main) { font: 600 12px var(--f-num); }
.desk-line > .ic { color: var(--muted); width: 16px; height: 16px; }
.desk-line.warn { border-color: var(--bad); background: var(--bad-soft); }
/* Ausblick */
.road { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.road li { display: flex; flex-direction: column; gap: 5px; padding: 10px; border: 1px dashed var(--line); border-radius: 6px; }
.road b { font-size: 14px; }
.chron li b { font-weight: 400; font-size: 13.5px; }

/* Probenbeutel: Stationen und Studien */
.bag { padding: 0 14px 14px; overflow: hidden; }
.bag-strip { margin: 0 -14px 8px; padding: 11px 14px 9px; background: var(--sheet-2); border-bottom: 1px dashed var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bag-name { font: 400 23px/1 var(--f-mark); letter-spacing: .02em; transform: rotate(-1.5deg); transform-origin: left center; }
.tape {
  flex: none; font: 700 11px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
  color: var(--tape-ink); background: var(--tape); padding: 6px 16px 6px 13px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 50%, 100% 100%, 0 100%, 6px 50%);
}
.bag-level { font-size: 13.5px; color: var(--ink-2); }
.study { display: flex; flex-direction: column; gap: 9px; }
.study .bag-strip { margin-bottom: 0; }
.study-name { font: 400 19px/1.15 var(--f-mark); letter-spacing: .01em; min-width: 0; overflow-wrap: anywhere; }
.ask { font: italic 400 15px/1.4 var(--f-pub); color: var(--ink-2); }
.stepper { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
.stepper li { font: 700 9.5px/1.2 var(--f-ui); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding-top: 5px; border-top: 3px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper li.done { border-top-color: var(--ink-2); color: var(--ink-2); }
.stepper li.now { border-top-color: var(--tape); color: var(--ink); }
.zone { display: block; width: 100%; height: auto; max-width: 100%; }
.zone-lbl text { font: 400 8px var(--f-ui); fill: var(--muted); }
.cap { font: 400 11.5px/1.3 var(--f-num); color: var(--muted); }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 6px; }
.sw:first-child { margin-left: 0; }
.sw.g1 { background: var(--ink-2); } .sw.g2 { background: var(--tape); }
.labq { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.labq li { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lq-name { font-weight: 700; font-size: 13.5px; }
.labq small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.finds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.find { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.finds > .find:first-child { border-top: 0; padding-top: 0; }
.f-name { font-weight: 700; font-size: 14px; }
.f-eff { grid-column: 1; font-size: 13px; color: var(--ink-2); }
.f-p { grid-column: 2; grid-row: 1 / span 2; align-self: center; text-align: right; font: 600 11.5px/1.3 var(--f-num); color: var(--muted); }
.find.sig .f-p { color: var(--ok); }
.find.used { opacity: .55; }
.prio { display: flex; gap: 6px; justify-content: flex-end; }
.study-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.study-foot .prio { margin-left: auto; }
.linkish .turn.open { transform: rotate(90deg); }
.pc-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
.pc-top .tag { flex: none; }
.fold > summary, .fold-row > summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.fold > summary::-webkit-details-marker, .fold-row > summary::-webkit-details-marker { display: none; }
.fold > summary h2 { display: flex; align-items: center; gap: 8px; }
.fold > summary .turn, .fold-row > summary .turn { color: var(--muted); transition: transform .15s; }
.fold[open] > summary .turn, .fold-row[open] > summary .turn { transform: rotate(90deg); }
.fold[open] > summary { margin-bottom: 12px; }
.fold-row > summary { padding: 10px 0; }
.fold-row[open] { display: flex; flex-direction: column; gap: 9px; padding-bottom: 12px; }
.plate { margin-top: 8px; padding: 10px; border-radius: 12px; background: var(--sheet-2); border: 1px solid var(--line); }
.wells { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.wells i { display: block; aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--well); box-shadow: inset 0 1px 1.5px var(--shadow); }
.wells i.on { background: var(--well-on); }
.wells i.now { background: var(--well-now); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.linkish { border: 0; background: none; padding: 4px 0; display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-size: 14px; color: var(--ink-2); cursor: pointer; align-self: flex-start; text-align: left; }
.linkish .ic { width: 15px; height: 15px; }

/* Knöpfe */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 6px;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: 700 14px/1.1 var(--f-ui); cursor: pointer; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.btn .ic { width: 16px; height: 16px; }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn.ghost { border-color: var(--line); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.primary.danger { background: var(--bad); color: var(--sheet); }
.btn.wide { width: 100%; min-height: 48px; }
.btn:disabled, .btn.poor { opacity: .42; cursor: not-allowed; }
.icon-btn { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--muted); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }

/* Listen */
.rows, .people, .mails, .jlist, .pubs, .opts, .achs, .ladder, .days, .rcards, .dec-list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.rows > .row:first-child { border-top: 0; padding-top: 2px; }
.row.stack { flex-wrap: wrap; }
.row.stack .row-main { flex-basis: 100%; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-main small { color: var(--muted); font-size: 13px; line-height: 1.38; }
.btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.btns.col { flex-direction: column; align-items: flex-end; align-self: flex-start; }
.row.stack .btns { margin-left: 0; }
.proj.on .tag { background: var(--ink); color: var(--sheet); border-color: transparent; }
.secs { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0; }
.secs span { font-size: 11px; line-height: 1.2; padding: 2px 6px; border-radius: 3px; background: var(--sheet-2); color: var(--muted); border: 1px solid var(--line); }
.secs span.done { color: var(--ok); border-color: transparent; background: var(--ok-soft); }
.secs span.now { color: var(--ink); border-color: var(--ink-2); }
.lock { display: inline-flex; align-items: flex-start; gap: 5px; font-size: 12.5px; line-height: 1.3; color: var(--muted); text-align: left; max-width: 52%; }
.row.stack .lock, .p-actions .lock { max-width: none; }
.lock .ic { width: 14px; height: 14px; margin-top: 1px; }
.owned { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ok); font-weight: 700; white-space: nowrap; }
.owned .ic { width: 15px; height: 15px; }
.is-owned b { color: var(--ink-2); }
.upg { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.maxed { display: flex; gap: 6px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--ok); }
.equip { margin-top: 10px; border-top: 1px solid var(--line); }
.equip summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 11px 0 3px; font-weight: 700; cursor: pointer; }
.equip summary::-webkit-details-marker { display: none; }
.equip summary .turn { margin-left: auto; transition: transform .15s; }
.equip[open] summary .turn { transform: rotate(90deg); }
.equip .rows { margin-top: 4px; }
.bag > .rows { margin-top: 10px; }

/* Balken */
.bar { display: block; height: 8px; border-radius: 999px; background: var(--sheet-2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: inherit; transition: width .3s linear; }
.bar.thin { height: 6px; }
.bar.data > i { background: var(--daten); } .bar.rep > i { background: var(--rep); } .bar.mot > i { background: var(--ok); } .bar.money > i { background: var(--euro); }
.bar.okbar > i { background: var(--ok); }
.bar.adminbar > i { background: var(--muted); }

/* Team */
.kv3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kv3 b { display: block; font: 600 14px/1.3 var(--f-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.people { display: flex; flex-direction: column; }
.person { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.people > .person:first-child { border-top: 0; padding-top: 0; }
.p-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.right { text-align: right; flex: none; max-width: 45%; }
.skills { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.skills:empty { display: none; }
.sk { display: inline-flex; align-items: center; gap: 6px; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.pips i.f { background: var(--pc, var(--ink-2)); }
.pips i.p { background: linear-gradient(90deg, var(--pc, var(--ink-2)) var(--fill), var(--line) var(--fill)); opacity: .8; }
.pips.k-feld { --pc: var(--a-feld); } .pips.k-labor { --pc: var(--a-labor); } .pips.k-stat { --pc: var(--a-stat); } .pips.k-schreiben { --pc: var(--a-schreiben); } .pips.k-mgmt { --pc: var(--a-verw); } .pips.k-lehre { --pc: var(--rep); }
.trait { align-self: flex-start; font-size: 12.5px; padding: 3px 8px; border-radius: 4px; background: var(--sheet-2); color: var(--ink-2); }
.phd { color: var(--ink-2); }
.mot { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.mot small { font: 400 11.5px var(--f-num); color: var(--muted); }
.p-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.p-actions .icon-btn { margin-left: auto; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 8px 10px; font: 700 12.5px/1 var(--f-ui); color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.cand.internal { background: var(--ok-soft); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }

/* Lehre */
.switch { position: relative; flex: none; width: 48px; height: 28px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--sheet-2); cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--ink); border-color: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(19px); background: var(--sheet); }
.sw-lbl { font-size: 13px; color: var(--muted); }
.quiz-q { font: 400 18px/1.4 var(--f-pub); text-wrap: pretty; }

/* Lebenslauf */
.cv-name { font: 600 27px/1.15 var(--f-pub); text-wrap: balance; overflow-wrap: anywhere; }
.cv-role { color: var(--ink-2); }
.cv { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.cv-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin-top: 8px; }
.stat b { display: block; font: 600 21px/1.15 var(--f-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat b.hbig { font: 600 34px/1.05 var(--f-pub); }
.hbig i { font-style: italic; }
.chart svg { display: block; width: 100%; height: auto; max-width: 100%; }
.chart .t { font: 400 9px var(--f-num); fill: var(--muted); }
.chart .t-s { font: 400 7.5px var(--f-num); fill: var(--muted); }
.chart .t-h { font: italic 600 13px var(--f-pub); fill: var(--ink); }
.ladder { display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 7px 0; position: relative; }
.step .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--sheet); display: grid; place-items: center; position: relative; z-index: 1; }
.step .dot .ic { width: 13px; height: 13px; stroke-width: 2.6; }
.step.done .dot { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.step.now .dot { border-color: var(--tape); background: var(--tape-soft); }
.step:not(:last-child)::after { content: ""; position: absolute; left: 10px; top: 29px; bottom: -8px; width: 2px; background: var(--line); }
.step.next b { color: var(--ink-2); font-weight: 400; }
.reqs { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.req .row-main { gap: 6px; }
.req-v { font: 400 12px var(--f-num); color: var(--muted); white-space: nowrap; }
.req-v.ok { color: var(--ok); font-weight: 600; }
.pubs { display: flex; flex-direction: column; }
.pub { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.pubs > .pub:first-child { border-top: 0; padding-top: 0; }
.pub-c { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--f-num); }
.pub-c b { font-size: 14px; font-weight: 600; } .pub-c small { font-size: 9.5px; color: var(--muted); }
.pub-ref { font: 400 14.5px/1.45 var(--f-pub); overflow-wrap: anywhere; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ach { display: flex; flex-direction: column; gap: 2px; padding: 10px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); min-width: 0; }
.ach b { font-size: 13.5px; line-height: 1.25; } .ach small { font-size: 12px; line-height: 1.3; }
.ach .ic { width: 16px; height: 16px; margin-bottom: 2px; }
.ach.got { border-style: solid; border-color: var(--ink-2); color: var(--ink); background: var(--sheet-2); }
.ach.got .ic { color: var(--tape); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 0; }
.stats div { display: flex; flex-direction: column; min-width: 0; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font: 600 14px/1.3 var(--f-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.plan-sum dd { font: 600 13px/1.35 var(--f-ui); }
.inline { display: flex; gap: 8px; }
input[type="text"], input[type="search"] { width: 100%; min-width: 0; min-height: 40px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--sheet-2); color: var(--ink); }

/* Tab-Leiste */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--sheet); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs .wrap { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tabs button { position: relative; border: 0; background: none; padding: 9px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 700 11px/1 var(--f-ui); color: var(--muted); cursor: pointer; min-width: 0; }
.tabs button > span:not(.dot) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs button .ic { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 24%; right: 24%; height: 3px; background: var(--tape); border-radius: 0 0 3px 3px; }
.tabs .dot { position: absolute; top: 4px; left: calc(50% + 7px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--tape); color: var(--tape-ink); font: 700 10px/16px var(--f-ui); }

/* Meldungen */
.toasts {
  position: fixed; left: 0; right: 0; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.toast {
  pointer-events: auto; width: 100%; max-width: 600px; display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 12px; border-radius: 8px; border: 0;
  background: var(--ink); color: var(--sheet); font-size: 14px; line-height: 1.38; box-shadow: 0 10px 24px -10px var(--shadow); animation: up .2s ease-out; cursor: pointer; transition: opacity .35s;
}
.toast .ic { margin-top: 1px; }
.toast.good { box-shadow: inset 4px 0 0 var(--ok), 0 10px 24px -10px var(--shadow); }
.toast.bad { box-shadow: inset 4px 0 0 var(--bad), 0 10px 24px -10px var(--shadow); }
.toast.dec { background: var(--tape); color: var(--tape-ink); }
.toast.out { opacity: 0; }

/* Bottom Sheet */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-bg { position: absolute; inset: 0; background: var(--overlay); animation: fade .2s; }
.sheet-panel {
  position: relative; width: 100%; max-width: 640px; margin: 0 auto; max-height: 90vh; max-height: 90dvh; overflow: auto; overscroll-behavior: contain;
  background: var(--sheet); border-radius: 14px 14px 0 0; animation: up .22s ease-out;
  padding-block: 0 calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#sheet-body { display: flex; flex-direction: column; gap: 12px; }
.sh-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-start; gap: 12px; padding-block: 16px 10px; background: var(--sheet); border-bottom: 1px solid var(--line); }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--sheet); cursor: pointer; }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--sheet-2); box-shadow: inset 3px 0 0 var(--tape); }
.opt:disabled { cursor: not-allowed; opacity: .6; }
.opt.core { border-style: dashed; opacity: 1; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); opacity: 1; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); opacity: 1; }
.opt .row-main { gap: 2px; }
.ooo-opt .row-main { gap: 5px; }
.sum { padding: 10px 12px; border-radius: 6px; background: var(--sheet-2); font-size: 14px; line-height: 1.5; }
.design { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stepbox { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.stepbox small { font-size: 11.5px; line-height: 1.3; }
.stepper-ctl { display: flex; align-items: center; gap: 10px; }
.stepper-ctl b { font: 600 20px/1 var(--f-num); min-width: 2ch; text-align: center; }
.stepper-ctl .icon-btn { font: 700 19px/1 var(--f-ui); color: var(--ink); }
.leads { display: flex; flex-wrap: wrap; }
.leads button { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.leads small { font-weight: 400; font-size: 10.5px; }
.frow { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.rows > .frow:first-child { border-top: 0; }
.frow .seg { margin-left: auto; }
.frow.used { opacity: .5; }
.days { display: flex; flex-direction: column; gap: 10px; }
.day { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 7px; }
.day.surge { border-color: var(--bad); background: var(--bad-soft); }
.day-top { display: flex; flex-wrap: wrap; gap: 3px 12px; align-items: baseline; }
.day-top b { font: 600 15px/1 var(--f-num); }
.day-top .small { font: 400 11.5px/1.3 var(--f-num); color: var(--ink-2); }
.day .btn { align-self: flex-start; }
.tide { display: block; width: 100%; height: auto; max-width: 100%; border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 12px; height: 9px; border-radius: 2px; border: 1px solid var(--line); }
.calpt { cursor: pointer; }
.jlist { display: flex; flex-direction: column; }
.jrow { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.jlist > .jrow:first-child { border-top: 0; }
.jrow .jn { font-size: 16px; font-weight: 600; }
.jrow.pred .jn { color: var(--bad); }
.jside { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.chance { font: 600 13px/1 var(--f-num); padding: 4px 7px; border-radius: 4px; }
.chance.ok { color: var(--ok); background: var(--ok-soft); } .chance.warn { color: var(--warn); background: var(--warn-soft); } .chance.bad { color: var(--bad); background: var(--bad-soft); }
.rcards { display: flex; flex-direction: column; gap: 14px; }
.rcard { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.rcards > .rcard:first-child { border-top: 0; padding-top: 0; }
.r-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sev { font-size: 10px; letter-spacing: 2px; color: var(--bad); white-space: nowrap; }
.rcard blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--bad); background: var(--sheet-2); font: italic 400 15px/1.45 var(--f-pub); color: var(--ink-2); }
.facts { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font: 400 15px/1.45 var(--f-pub); }
.recs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.recs .btn { white-space: normal; text-align: center; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 6px 11px; font: 700 12.5px/1.2 var(--f-ui); cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; text-align: left; }
.chip-btn small { font-weight: 400; color: var(--muted); }
.chip-btn[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
.chip-btn[aria-pressed="true"] small { color: inherit; opacity: .8; }
.mails { display: flex; flex-direction: column; }
.mail { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.4; }
.mails > .mail:first-child { border-top: 0; }
.mail.unread .row-main > span { font-weight: 700; }
.mail.spam .row-main > span { font-family: var(--f-pub); font-style: italic; color: var(--muted); font-weight: 400; }
.letter { padding: 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--sheet-2); font: 400 15.5px/1.55 var(--f-pub); display: flex; flex-direction: column; gap: 10px; }
.letter .lj { font-variant: small-caps; letter-spacing: .04em; font-weight: 600; font-size: 18px; }
.letter .small { font-family: var(--f-ui); }
.stamp { align-self: flex-start; font: 400 21px/1 var(--f-mark); color: var(--tape); border: 2.5px solid var(--tape); padding: 7px 11px 5px; border-radius: 5px; transform: rotate(-5deg); margin: 4px 0; }
.stamp.ok { color: var(--ok); border-color: var(--ok); }
.r2 { margin: 0; padding: 10px 12px; border-left: 3px solid var(--bad); background: var(--sheet); font-style: italic; display: flex; flex-direction: column; gap: 4px; }
.r2 .eyebrow { font-style: normal; color: var(--bad); }
.welcome { display: flex; flex-direction: column; gap: 12px; padding-top: 22px; }
.logo { font: 400 31px/1.1 var(--f-mark); transform: rotate(-2deg); transform-origin: left center; color: var(--ink); text-wrap: balance; }
.loop { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.prose { display: flex; flex-direction: column; gap: 10px; max-width: 65ch; }
/* Bereichsfarben: Feld, Labor, Halle, Statistik, Schreiben, Verwaltung. Farbe kennzeichnet, Text bleibt in Tintenfarbe. */
.a-feld { --a: var(--a-feld); --a-soft: var(--a-feld-soft); }
.a-labor { --a: var(--a-labor); --a-soft: var(--a-labor-soft); }
.a-halle { --a: var(--a-halle); --a-soft: var(--a-halle-soft); }
.a-stat { --a: var(--a-stat); --a-soft: var(--a-stat-soft); }
.a-schreiben { --a: var(--a-schreiben); --a-soft: var(--a-schreiben-soft); }
.a-verw { --a: var(--a-verw); --a-soft: var(--a-verw-soft); }
.bag[class*="a-"] > .bag-strip { box-shadow: inset 5px 0 0 var(--a); }
.dec-ic[class*="a-"] { background: var(--a-soft); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--a); }
.tag[class*="t-"] { box-shadow: inset 3px 0 0 var(--tc, transparent); padding-left: 8px; }
.tag.t-analysis, .tag.t-reanalyse { --tc: var(--a-stat); }
.tag.t-paper, .tag.t-revision, .tag.t-coauth { --tc: var(--a-schreiben); }
.tag.t-grant { --tc: var(--euro); }
.tag.t-lecture, .tag.t-relecture, .tag.t-exam { --tc: var(--rep); }
.tag.t-review { --tc: var(--a-verw); }
.chip.fach { border-color: var(--a, var(--line)); background: var(--a-soft, var(--sheet-2)); color: var(--ink); }
.seg.st button[aria-pressed="true"] { background: var(--a-soft); color: var(--ink); box-shadow: inset 0 -3px 0 var(--a); }
.chip-btn[class*="a-"][aria-pressed="true"] { background: var(--a-soft); color: var(--ink); border-color: var(--a); }
.chip-btn .ld-sw { width: 8px; height: 8px; margin-right: 1px; }
.bar.k-feld > i { background: var(--a-feld); } .bar.k-labor > i { background: var(--a-labor); } .bar.k-stat > i { background: var(--a-stat); } .bar.k-schreiben > i { background: var(--a-schreiben); }
.bar.lvbar > i { background: var(--euro); }
.lvname { font-weight: 700; color: var(--ink); }
/* Personen */
.av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--f-ui); color: var(--ink); background: var(--a-soft, var(--sheet-2)); border: 2px solid var(--a, var(--line)); }
.av.lg { width: 52px; height: 52px; font-size: 16px; border-width: 3px; }
.c-av { --a: var(--rep); --a-soft: var(--sheet-2); }
.c-av.alum { --a: var(--tape); --a-soft: var(--tape-soft); }
.rfil { display: flex; flex-wrap: wrap; gap: 6px; }
.roster { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.roster > .rrow + .rrow { border-top: 1px solid var(--line); }
.rbtn { width: 100%; display: flex; align-items: center; gap: 11px; padding: 9px 0; border: 0; background: none; text-align: left; cursor: pointer; }
.rbtn > .ic { color: var(--muted); }
.r-side { display: flex; align-items: center; gap: 6px; flex: none; }
.r-mot { width: 26px; height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--ok) var(--m), var(--line) var(--m)); }
.r-mot.low { background: linear-gradient(90deg, var(--bad) var(--m), var(--line) var(--m)); }
.r-dot { color: var(--tape); display: inline-flex; } .r-dot .ic { width: 15px; height: 15px; }
.r-away { font: 700 10px/1 var(--f-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--warn); }
.pa-top { display: flex; gap: 12px; align-items: center; }
.sk-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.icon-btn.info { font: 700 15px/1 var(--f-ui); color: var(--ink-2); }
.plink { border: 0; background: none; padding: 0; font: inherit; color: var(--ink-2); text-decoration: underline dotted; text-underline-offset: 2px; cursor: pointer; }
.relbar { display: block; width: 100%; max-width: 220px; height: 6px; border-radius: 999px; border: 1px solid var(--line); background: linear-gradient(90deg, var(--rep) var(--r), var(--sheet-2) var(--r)); }
.ads { margin-top: 4px; }
/* Auslastung */
.loads { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.loads > li + li { border-top: 1px solid var(--line); }
.ld-row { width: 100%; display: flex; flex-direction: column; gap: 5px; padding: 8px 0; border: 0; background: none; text-align: left; cursor: pointer; }
.ld-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.ld-top b { font-size: 14px; }
.ld-top small { font-size: 12px; color: var(--muted); }
.ld-sw { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--a); }
.ld-st { margin-left: auto; font: 600 12px/1.2 var(--f-num); color: var(--ink-2); white-space: nowrap; }
.ld-st.s-voll { color: var(--warn); } .ld-st.s-stau, .ld-st.s-leer { color: var(--bad); } .ld-st.s-frei { color: var(--muted); font-weight: 400; }
.ld-bar { display: block; height: 8px; border-radius: 999px; background: var(--sheet-2); border: 1px solid var(--line); overflow: hidden; }
.ld-bar > i { display: block; height: 100%; background: var(--a); border-radius: inherit; }
.ld-bar.empty { border-style: dashed; background: transparent; }
.ld-bar.empty > i { display: none; }
.ld-sub { font-size: 12px; color: var(--muted); line-height: 1.35; }
/* Ergebnispool */
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.three .btn { width: 100%; padding: 0 6px; }
.ds-ic { flex: none; align-self: stretch; width: 5px; min-height: 26px; border-radius: 3px; background: var(--a); }
.fs { font-weight: 700; } .fs.free { color: var(--ok); } .fs.used { color: var(--muted); font-weight: 400; }
.seg.wide3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg.wide3 button { padding: 10px 6px; }
.chk { flex: none; width: 34px; height: 34px; padding: 0; border-radius: 6px; border: 1.5px solid var(--line); background: var(--sheet); display: grid; place-items: center; cursor: pointer; color: transparent; margin-left: auto; }
.chk[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.pt-tag { display: inline-block; font: 700 9.5px/1 var(--f-ui); font-style: normal; text-transform: uppercase; letter-spacing: .05em; padding: 3px 5px; border-radius: 3px; background: var(--sheet-2); border: 1px solid var(--line); color: var(--ink-2); vertical-align: 2px; }
/* Fähigkeiten erklärt */
.sk-sec { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); border-left: 5px solid var(--a); }
.sk-sec.on { background: var(--a-soft); }
.sk-sec h3 { display: flex; align-items: center; gap: 8px; font: 700 15px/1.2 var(--f-ui); }
@keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
@media (min-width: 700px) { body { font-size: 15.5px; } .cv-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
</head>

    <div class="l-top">

    help: function () {
      return head('Spielprinzip') + '<div class="prose">' +
        '<p><b>Studien</b> sind das Herz des Spiels. Du wählst eine Fragestellung, Messgrößen, Replikate und Kampagnen. Mehr Replikate erhöhen die Teststärke, kosten aber Feld- und Laborzeit. Ob ein Effekt echt ist, weißt du vorher nicht.</p>' +

        '<p><b>Feldgebiete:</b> Jede Studie läuft in einem Gebiet. Gebiete unterscheiden sich in Anreise, Reisekosten, Genehmigung, Tide, Wind und darin, welche Fragen dort besonders neu sind. Methan entlang des Salzgradienten geht nur an der Elbe, Rückdeichung nur an der Ostsee. Neue Gebiete erschließt du im Institut.</p>' +
        '<p><b>Ortskenntnis und Langzeitreihen:</b> Jede Kampagne bringt Ortskenntnis, von »Neuland« bis »Legende«, mit weniger Vorbereitung, besseren Terminen und schnelleren Genehmigungen. Dauerplots machen jedes Jahr mit Kampagne zum Datenjahr, ab fünf Datenjahren lohnt eine Langzeitsynthese.</p>' +

        '<p><b>Ämter und Preise:</b> Mit Karriere und Renommee kommen Anfragen für Ämter: mehr Renommee und Einfluss, aber weniger Zeit. Einmal im Jahr werden Preise vergeben, wenn du die Bedingungen erfüllst. Ab W2 gibt es ein Forschungsfreisemester und einen zweiten Schwerpunkt.</p>' +
        '<p><b>Labor:</b> Jede Messgröße braucht ein Gerät. Geräte haben Kapazität, müssen kalibriert werden und gehen kaputt. Gasproben verderben, wenn sie zu lange warten.</p>' +
        '<p><b>Auswertung:</b> Mehrere Kampagnen an denselben Plots sind keine unabhängigen Wiederholungen. Wer alles poolt, bekommt schöne p-Werte und später Ärger mit den Gutachter*innen.</p>' +
        '<p><b>Ergebnispool und Manuskripte:</b> Jede ausgewertete Studie landet im Ergebnispool. Ein Artikel braucht einen Hauptbefund und bis zu drei stützende, auch aus verschiedenen Studien, dazu die Rahmung. Synthesen fassen Befunde zur selben Messgröße aus mehreren Studien zusammen, Datenpaper veröffentlichen einen ganzen Datensatz, beides auch mit schon veröffentlichten Daten. Unveröffentlichte Befunde verlieren nach einem halben Jahr langsam an Neuheit. Danach schreiben, Ko-Autor*innen lesen gegen, du wählst die Zeitschrift und antwortest auf Gutachten.</p>' +

      var pl = d.data.plan;
      var params = pl.params.slice(); params._q = pl.q;
      if (pl.kind === 'exp') { openSheet('xplan', { fac: pl.fac, q: pl.q, n: pl.n, lv: pl.lv, dur: pl.dur, params: params, lead: pl.lead, fromDec: x }); return; }
      openSheet('plan', { q: pl.q, n: pl.n, k: pl.k, params: params, lead: pl.lead, reg: pl.reg, fromDec: x });
    },
    story: function (x) { var d = S.dec.filter(function (y) { return y.type === 'story' && y.ref === x; })[0]; openSheet('compose', { type: 'orig', sid: x, did: d ? d.id : null }); },
    compose: function (x, y) { openSheet('compose', { type: x || 'orig', ds: x === 'data' ? y || null : null, sid: x === 'orig' ? y || null : null }); },
    ctype: function (x) {
      var a = sheet.args;
      if (a.type === x) return;
      var x0 = a.main ? P.refOf(S, a.main) : null;
      if (x0) { if (x === 'data') a.ds = x0.ds.id; if (x === 'orig') a.sid = x0.ds.id; if (x === 'syn') a.par = x0.f.param; }
      a.type = x; a.init = false; renderSheet();
    },
    cmain: function (x) { var a = sheet.args; a.main = x; a.sup = (a.sup || []).filter(function (r) { return r !== x; }); renderSheet(); },
    csup: function (x) {
      var a = sheet.args;
      a.sup = a.sup || [];
      if (a.type === 'syn') {
        if (a.main === x) a.main = a.sup.shift() || null;
        else { var i = a.sup.indexOf(x); if (i >= 0) a.sup.splice(i, 1); else if (!a.main) a.main = x; else if (a.sup.length < 7) a.sup.push(x); else return warn('Höchstens acht Befunde.'); }
      } else {
        var j = a.sup.indexOf(x);
        if (j >= 0) a.sup.splice(j, 1); else if (a.sup.length < 3) a.sup.push(x); else return warn('Höchstens drei stützende Befunde.');
      }
      renderSheet();
    },
    cpar: function (x) { var a = sheet.args; a.par = x; a.type = 'syn'; a.init = false; renderSheet(); },
    cds: function (x) { var a = sheet.args; a.ds = x; a.main = x + ':0'; renderSheet(); },
    cext: function (x) { var a = sheet.args; a.ext = a.ext || []; var i = a.ext.indexOf(x); if (i >= 0) a.ext.splice(i, 1); else if (a.ext.length < 2) a.ext.push(x); else return warn('Höchstens zwei externe Ko-Autor*innen.'); renderSheet(); },
    cextall: function () { openD.cext = !openD.cext; renderSheet(); },
    csynall: function () { openD.csyn = !openD.csyn; renderSheet(); },
    cstart: function () {
      var a = sheet.args, err = P.startCompose(S, composePlan(a), evs);
      if (err) return warn(err);
      if (a.did && P.decision(S, a.did)) P.dismissDecision(S, a.did);
      sheet = null; renderSheet(); tab = 'schreiben'; window.scrollTo(0, 0);
      done(null, (a.type === 'syn' ? 'Synthese' : a.type === 'data' ? 'Datenpaper' : 'Manuskript') + ' angelegt. Es liegt jetzt auf dem Schreibtisch.');
    },
    cpool: function () { var a = sheet.args; if (a.did && P.decision(S, a.did)) P.resolveDecision(S, a.did, 'pool', evs, false); sheet = null; renderSheet(); done(null, 'Die Befunde bleiben im Ergebnispool.'); },
    poolf: function (x) { poolF = x; render(); },
    poolall: function () { openD.poolAll = !openD.poolAll; render(); },
    reanal: function (x) { done(P.startReanalysis(S, x, evs), 'Die Neuauswertung liegt auf dem Schreibtisch und läuft über die Statistikstunden.'); },
    person: function (x) { openSheet('person', { pid: x }); },
    skill: function (x) {
      openSheet('skill', { k: x || '' });
      var el = x ? $('#sk-' + x) : null, pnl = $('.sheet-panel');
      if (el && pnl) pnl.scrollTop = Math.max(0, el.offsetTop - 80);
    },
    rf: function (x) { rosterF = x || ''; render(); },
    load: function (x) {
      if (x === 'verw') { openSheet('away', {}); return; }
      if (x === 'stat' || x === 'schreiben') { tab = 'schreiben'; window.scrollTo(0, 0); render(); return; }
      rosterF = x; tab = 'team'; window.scrollTo(0, 0); render();
    },
    net: function () { openSheet('net', {}); },
    contact: function (x) { openSheet('contact', { cid: x }); },
    tend: function (x) { done(P.tendContact(S, x), 'Gepflegt. Die Beziehung wird enger.'); },
    coop: function (x) {
      var err = P.proposeCoop(S, x, evs);
      if (err) return warn(err);
      flushEvents();
      var d = S.dec.filter(function (y) { return y.type === 'coauth'; })[0];
      if (d) openDecision(d.id); else done(null);
    },
    postad: function () { var a = sheet.args, err = P.postAd(S, a.role, a.focus || null, evs); if (err) return warn(err); sheet = null; renderSheet(); done(null, 'Stelle ausgeschrieben.'); },
    kaltoggle: function (x) { var a = sheet.args; a.ex = a.ex || []; var i = a.ex.indexOf(+x); if (i >= 0) a.ex.splice(i, 1); else a.ex.push(+x); renderSheet(); },
    kalsave: function () { var res = P.resolveDecision(S, sheet.args.did, (sheet.args.ex || []).slice(), evs, false); sheet.args.res = res; flushEvents(); renderSheet(); render(); },
    rch: function (x, y) { sheet.args.ch[+x] = y; renderSheet(); },
    rsend: function () { P.resolveDecision(S, sheet.args.did, sheet.args.ch.slice(), evs, false); sheet = null; renderSheet(); done(null, 'Die Antwort an die Gutachter*innen ist in Arbeit.'); },
    submitm: function (x, y) { openSheet('submit', { mid: x, did: y || null }); },
    submit: function (x, y) { var err = P.submit(S, x, y, evs); if (err) return warn(err); sheet = null; renderSheet(); done(null); },
    skipfb: function (x) { done(P.skipFeedback(S, x), 'Weiter ohne Ko-Autor*innen-Runde.'); },
    review: function (x) { openSheet('review', { rid: x }); },
    racc: function (x, y) { var err = P.acceptReview(S, x, y); if (err) return warn(err); sheet = null; renderSheet(); done(null, 'Gutachten angenommen: ' + P.REC_NAME[y] + '. Es liegt auf dem Schreibtisch.'); },
    rdec: function (x) { P.declineReview(S, x); if (sheet) { sheet = null; renderSheet(); } done(null); },
    grant: function (x) { var err = P.newGrant(S, x, sheet.args.topic, evs); if (err) return warn(err); sheet = null; renderSheet(); done(null, P.GRANTM[x].name + ': Der Antrag liegt auf dem Schreibtisch.'); },
    lecture: function (x) { var err = P.newLecture(S, x); if (err) return warn(err); sheet = null; renderSheet(); done(null, P.MODM[x].name + ': Die Vorbereitung liegt auf dem Schreibtisch.'); },
    relecture: function (x) { done(P.reviseLecture(S, x), 'Die Überarbeitung liegt auf dem Schreibtisch.'); },
    tmod: function (x) { P.toggleModule(S, x); done(null); },
    active: function (x) { P.setActive(S, x); done(null); },
    drop: function (x) { var p = P.project(S, x); if (p) confirmSheet('»' + p.title + '« verwerfen? Die bisherige Arbeit geht verloren.', 'drop2', x, 'Verwerfen', 'Projekt verwerfen'); },
    drop2: function (x) { var err = P.dropProject(S, x, evs); sheet = null; renderSheet(); done(err); },
    prio: function (x, y) { P.studyPrio(S, x, +y); done(null); },

    dev: function (x) { openSheet('person', { pid: x }); },
    region: function (x) { openSheet('region', { rid: x }); },
    regopen: function (x) { done(P.openRegion(S, x, evs)); },
    reqbuy: function (x, y) { done(P.buyReq(S, x, y, evs)); },
    synth: function (x) { var err = P.startSynthesis(S, x, evs); if (err) return warn(err); sheet = null; renderSheet(); tab = 'schreiben'; done(null, 'Langzeitsynthese gestartet. Die Auswertung liegt auf dem Schreibtisch.'); },
    tempo: function (x) { P.setTempo(S, x); done(null, 'Spieltempo: ' + tempoName(P.tempo(S))); },
    chron: function () { openD.chron = !openD.chron; renderSheet(); },
    wstep: function (x) { var nm = $('#nm0'); if (nm) sheet.args.name = nm.value; sheet.args.step = +x; renderSheet(); var pnl = $('.sheet-panel'); if (pnl) pnl.scrollTop = 0; },
    wspec: function (x) { sheet.args.spec = x; renderSheet(); },
    wadd: function (x, y) {
      var a = sheet.args, used = P.PI_SKILLS.reduce(function (s, k) { return s + (a.add[k] || 0); }, 0), v = (a.add[x] || 0) + (+y);
      if (v < 0 || v > 2 || (+y > 0 && used >= 3)) return;
      a.add[x] = v; renderSheet();
    },
    wtal: function (x) { sheet.args.talent = sheet.args.talent === x ? null : x; renderSheet(); },
    wtempo: function (x) { sheet.args.tempo = +x; renderSheet(); },
    spec: function (x) { var err = P.setSpec(S, x); done(err, err ? null : 'Schwerpunkt: ' + P.SPECM[x].name + '.'); },
    pt: function (x) { var err = P.spendPoint(S, x); done(err, err ? null : P.PI_SKILL_NAME[x] + ' jetzt ' + S.pi.sk[x] + '.'); },
    tal: function (x) { var err = P.pickTalent(S, x); done(err, err ? null : 'Neues Talent: ' + P.TALM[x].name + '.'); },
    focus: function (x, y) { done(P.setFocus(S, x, y || null)); },
    srename: function (x) {
      var el = $('#srn'), err = P.renameStaff(S, x, el ? el.value : '');
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      done(err, err ? null : 'Name geändert.');
    },
    neuprofil: function () { S.flags.v4seen = true; S.flags.v5seen = true; S.flags.v6seen = true; openSheet('profil', {}); },
    train: function (x, y) { if (!done(P.train(S, x, y, evs))) return; },
    thesis: function (x) { var p = P.person(S, x), err = P.offerThesis(S, x, evs); if (err) return warn(err); sheet = null; renderSheet(); done(null, (p ? p.name : 'Die Person') + ' wechselt zu den Abschlussarbeiten.'); },
    lablead: function (x) { done(P.makeLabLead(S, x, evs)); },
    cdec: function (x) { P.declineCand(S, x); done(null); },
    tpick: function (x, y) { var pl = sheet.args.plan; if (x === 'pi') pl.pi = y === '1'; else pl[x] = y; if (x === 'who' && y === 'pi') pl.pi = true; renderSheet(); },
    tsend: function () {
      var a = sheet.args, d = P.decision(S, a.did);
      if (!d) { closeSheet(); return; }
      var C = P.CONFM[d.data.conf], reg = P.resolveDecision(S, a.did, Object.assign({}, a.plan), evs, false);
      flushEvents();
      if (!reg) { sheet = null; renderSheet(); render(); return; }
      a.res = { demoted: reg.demoted, msg: (reg.demoted ? 'Der Vortrag wurde abgelehnt, ihr zeigt ein Poster.' : reg.type === 'keynote' ? 'Keynote zugesagt.' : reg.type === 'talk' ? 'Vortrag angenommen!' : 'Poster angenommen.') + ' ' + C.name + ' in ' + C.ort + ', in ' + wks(reg.at - S.week) + '.' };
      renderSheet(); render();
    },
    copycode: function () {
      var t = $('#excode'), code = sheet && sheet.args.code;
      var manual = function () { if (t) { t.focus(); t.select(); } note('Der Code ist markiert. Kopiere ihn über das Kontextmenü.'); };
      try { navigator.clipboard.writeText(code).then(function () { note('Code kopiert.'); }, manual); } catch (e) { manual(); }
    },
    importcheck: function () {
      var v = ($('#incode') && $('#incode').value || '').trim();
      readCode(v).then(function (obj) { if (!obj) throw new Error('leer'); sheet.args.preview = obj; sheet.args.err = null; renderSheet(); }, function () { sheet.args.err = 'Der Code ist unvollständig oder beschädigt.'; renderSheet(); });
    },
    importgo: function () {
      var x = sheet && sheet.args.preview;
      if (!x) return;
      x.lastSeen = Date.now(); x.savedAt = Date.now() + 5000; x.flags.onboarded = true;
      S = x; sheet = null; renderSheet(); lastTick = Date.now(); saveLocal(); saveDb(); render(); note('Spielstand übernommen.');
    },
    cloudon: function () { lsSet(CLOUD_KEY, newCloudCode()); initFirebase(false); renderSheet(); note('Cloud-Speicher eingeschaltet.'); },
    cloudoff: function () { try { localStorage.removeItem(CLOUD_KEY); } catch (e) { /* egal */ } store.ref = null; store.status = 'gerät'; renderSheet(); note('Cloud-Speicher ausgeschaltet. Der Spielstand bleibt auf diesem Gerät.'); },
    cloudcopy: function () { var c = fmtCode(lsGet(CLOUD_KEY) || ''); try { navigator.clipboard.writeText(c).then(function () { note('Code kopiert.'); }, function () { note('Code: ' + c); }); } catch (e) { note('Code: ' + c); } },
    cloudset: function () {
      var v = (($('#cloudcode') && $('#cloudcode').value) || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (v.length !== 20) return warn('Der Code hat 20 Zeichen.');
      lsSet(CLOUD_KEY, v); sheet = null; renderSheet(); initFirebase(true); note('Verbinde mit dem Cloud-Speicher …');
    },
    fold: function (x, y, el) { openD[x] = !(el && el.getAttribute('aria-expanded') === 'true'); render(); },
    lvl: function (x) { done(P.upgradeStation(S, x, evs)); },
    buy: function (x) { done(P.buy(S, x, evs)); },
    buyinst: function (x) { done(P.buyInst(S, x, evs)); },
    autos: function (x) { done(P.buyAutosampler(S, x, evs)); },
    hire: function (x) { done(P.hire(S, x, evs)); },
    assign: function (x, y) { done(P.assign(S, x, y)); },
    talk: function (x) { done(P.talk(S, x), 'Gutes Gespräch. Die Motivation steigt.'); },
    party: function () { done(P.party(S), 'Grillabend am Deich: Würstchen, Mücken, gute Stimmung.'); },
    fire: function (x) { var p = P.person(S, x); if (p) confirmSheet('Den Vertrag von ' + p.name + ' wirklich beenden?', 'fire2', x, 'Vertrag beenden', 'Vertrag beenden'); },
    fire2: function (x) { P.dismiss(S, x, evs); sheet = null; renderSheet(); done(null); },
    aacc: function (x) { done(P.acceptApplicant(S, x, evs)); },
    adec: function (x) { P.declineApplicant(S, x); done(null); },
    sup: function (x) { done(P.supervise(S, x), 'Betreuungsgespräch geführt.'); },
    smove: function (x, y) { P.moveStudent(S, x, y); done(null); },
    quiz: function () { if (P.quizReady(S)) openSheet('quiz', { q: P.quizQuestion() }); },
    answer: function (x) { if (sheet.args.res != null) return; var r = P.answerQuiz(S, +x); if (r == null) return; sheet.args.res = r; sheet.args.pick = +x; renderSheet(); dirty = true; },
    apply: function () { done(P.applyCareer(S, evs)); },
    letter: function (x) { openSheet('letter', { id: x }); },
    inbox: function () { openSheet('inbox'); },
    pubs: function () { showAllPubs = !showAllPubs; renderSheet(); },
    rename: function () {
      var v = ($('#nm').value || '').trim().replace(/\s+/g, ' ');
      if (v.length < 2) return warn('Bitte gib einen Namen ein.');
      var old = S.name; S.name = v;
      S.papers.concat(S.manus).forEach(function (p) { if (p.authors) p.authors = p.authors.map(function (a) { return a === old ? v : a; }); });
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      done(null, 'Name geändert.');
    },
    begin: function () {
      var a = (sheet && sheet.args) || {}, nm = $('#nm0'), v = ((nm ? nm.value : a.name) || '').trim().replace(/\s+/g, ' ');
      S.name = v.length >= 2 ? v : 'Alex Watt';
      if (a.step === 2) P.createProfile(S, { spec: a.spec || 'bgc', add: a.add || {}, talent: a.talent || null, tempo: a.tempo || 2 });
      S.flags.onboarded = true; S.flags.v4seen = true; S.flags.v5seen = true; S.flags.v6seen = true;
      sheet = null; renderSheet();
      lastTick = Date.now(); S.lastSeen = Date.now();
      saveLocal(); saveDb(); render();
    },
    reset: function () { confirmSheet('Wirklich neu beginnen? Dein gesamter Fortschritt geht verloren, auch der im Konto gespeicherte.', 'reset2', '', 'Neu beginnen', 'Neu beginnen'); },
    reset2: function () {
      S = P.newState(S.name, Date.now()); freshLocal = false; showAllPubs = false; tab = 'heute';
      saveLocal(); saveDb(); openSheet('welcome'); render();
    }
  };

  function bindGlobal() {
    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-a]');
      if (!el || el.disabled) return;
      var f = ACTIONS[el.getAttribute('data-a')];
      if (!f) return;
      e.preventDefault();
      f(el.getAttribute('data-x'), el.getAttribute('data-y'), el);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && sheet) closeSheet();
      if (e.key === 'Enter' && e.target && e.target.id === 'nm') ACTIONS.rename();
      if (e.key === 'Enter' && e.target && e.target.id === 'nm0') ACTIONS.wstep('2');
      if (e.key === 'Enter' && e.target && e.target.id === 'srn' && sheet && sheet.args.pid) ACTIONS.srename(sheet.args.pid);
      if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('mk') && e.target.getAttribute('data-a')) {
        e.preventDefault(); var fn = ACTIONS[e.target.getAttribute('data-a')]; if (fn) fn(e.target.getAttribute('data-x'), e.target.getAttribute('data-y'), e.target);
      }
      if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('calpt')) { e.preventDefault(); ACTIONS.kaltoggle(e.target.getAttribute('data-x')); }
    });
    document.addEventListener('input', function (e) { if (e.target && e.target.id === 'rq') { rosterQ = String(e.target.value || '').trim().toLowerCase(); applyRoster(); } });
    document.addEventListener('pointerdown', chartHover);
    document.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse') chartHover(e); });
    document.addEventListener('toggle', function (e) { var d = e.target; if (d && d.getAttribute && d.getAttribute('data-d')) openD[d.getAttribute('data-d')] = d.open; }, true);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') persistNow(); else tick(); });
    window.addEventListener('pagehide', persistNow);
  }
  window.PPPUI = { state: function () { return S; }, open: openSheet, openDecision: openDecision, render: render, refresh: refresh };

  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(function () { return { state: S ? P.serialize(S) : null, tab: tab }; }); } catch (e) { /* ohne Hot-Reload */ } }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });</script>
